﻿﻿﻿<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3fb950"/>
    </marker>
    <linearGradient id="grad-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="50%" style="stop-color:#bc8cff"/>
      <stop offset="100%" style="stop-color:#f0883e"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="960" fill="#0d1117"/>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="url(#grad-title)">E06 · Agent 性能量化体系架构</text>
  <text x="600" y="75" text-anchor="middle" font-size="14" fill="#8b949e">三层黄金指标 + 自动化评测流水线 + 工程兜底方案</text>

  <!-- ========== Left Column: Three-Layer Metrics ========== -->
  <rect x="40" y="110" width="520" height="440" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="145" font-size="18" font-weight="700" fill="#58a6ff">三层黄金指标体系</text>
  <text x="60" y="168" font-size="12" fill="#8b949e">结果 · 过程 · 成本 全覆盖</text>

  <!-- L1 Business Results -->
  <rect x="60" y="195" width="480" height="95" rx="8" fill="#1c2128" stroke="#3fb950" stroke-width="2"/>
  <rect x="60" y="195" width="480" height="28" rx="8" fill="rgba(63,185,80,0.15)"/>
  <text x="75" y="215" font-size="14" font-weight="700" fill="#3fb950">L1 · 业务结果层</text>
  <text x="280" y="215" font-size="11" fill="#8b949e">（老板关心）</text>
  <text x="75" y="245" font-size="13" fill="#e6edf3">任务成功率 → 自动化脚本校验 → CI/CD 质量门禁</text>
  <text x="75" y="268" font-size="12" fill="#8b949e">验证维度：订单状态 / 乘客信息 / 价格一致性</text>
  <text x="75" y="285" font-size="12" fill="#8b949e">门禁阈值：成功率 ≥ 95% 方可上线</text>

  <!-- Arrow L1 -> L2 -->
  <line x1="300" y1="295" x2="300" y2="320" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- L2 Execution Traces -->
  <rect x="60" y="330" width="480" height="110" rx="8" fill="#1c2128" stroke="#f0883e" stroke-width="2"/>
  <rect x="60" y="330" width="480" height="28" rx="8" fill="rgba(240,136,62,0.15)"/>
  <text x="75" y="350" font-size="14" font-weight="700" fill="#f0883e">L2 · 执行轨迹层</text>
  <text x="280" y="350" font-size="11" fill="#8b949e">（工程师关心）</text>
  <text x="75" y="380" font-size="13" fill="#e6edf3">① 工具调用准确率 → 选对工具？传对参数？</text>
  <text x="75" y="400" font-size="13" fill="#e6edf3">② 轨迹效率 → 完成任务所需步数</text>
  <text x="75" y="420" font-size="13" fill="#e6edf3">③ 自我纠错率 → 报错后能否自主修复</text>
  <text x="75" y="435" font-size="11" fill="#8b949e">工具：LangSmith / LangFuse 全链路追踪</text>

  <!-- Arrow L2 -> L3 -->
  <line x1="300" y1="445" x2="300" y2="470" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- L3 System Cost -->
  <rect x="60" y="480" width="480" height="55" rx="8" fill="#1c2128" stroke="#bc8cff" stroke-width="2"/>
  <rect x="60" y="480" width="480" height="28" rx="8" fill="rgba(188,140,255,0.15)"/>
  <text x="75" y="500" font-size="14" font-weight="700" fill="#bc8cff">L3 · 系统成本层</text>
  <text x="280" y="500" font-size="11" fill="#8b949e">（财务关心）</text>
  <text x="75" y="525" font-size="12" fill="#e6edf3">端到端延迟 + Token 消耗 + 成本红线（如订票 ≤ ¥0.5）</text>

  <!-- ========== Right Column: Evaluation Pipeline ========== -->
  <rect x="590" y="110" width="570" height="280" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="610" y="145" font-size="18" font-weight="700" fill="#58a6ff">自动化评测流水线</text>
  <text x="610" y="168" font-size="12" fill="#8b949e">硬断言 + 软裁判 双轨并行</text>

  <!-- Deterministic Tasks -->
  <rect x="610" y="195" width="250" height="85" rx="8" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/>
  <text x="625" y="220" font-size="14" font-weight="600" fill="#3fb950">确定性任务</text>
  <text x="625" y="240" font-size="12" fill="#e6edf3">SQL / API / 查数据</text>
  <text x="625" y="260" font-size="12" fill="#8b949e">有标准答案，可自动比对</text>
  <text x="625" y="275" font-size="11" fill="#8b949e">零人工干预</text>

  <!-- Non-deterministic Tasks -->
  <rect x="890" y="195" width="250" height="85" rx="8" fill="#1c2128" stroke="#f0883e" stroke-width="1.5"/>
  <text x="905" y="220" font-size="14" font-weight="600" fill="#f0883e">非确定性任务</text>
  <text x="905" y="240" font-size="12" fill="#e6edf3">写邮件 / 报告 / 客服</text>
  <text x="905" y="260" font-size="12" fill="#8b949e">无标准答案，需主观判断</text>
  <text x="905" y="275" font-size="11" fill="#8b949e">模型 + 人工双重校验</text>

  <!-- Arrows down -->
  <line x1="735" y1="285" x2="735" y2="310" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="1015" y1="285" x2="1015" y2="310" stroke="#f0883e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Hard Assertions -->
  <rect x="610" y="315" width="250" height="60" rx="8" fill="rgba(63,185,80,0.1)" stroke="#3fb950" stroke-width="1.5"/>
  <text x="625" y="340" font-size="14" font-weight="600" fill="#3fb950">硬断言</text>
  <text x="625" y="360" font-size="12" fill="#e6edf3">单元测试：输入→输出→比对</text>
  <text x="625" y="372" font-size="11" fill="#8b949e">pass / fail 绝对客观</text>

  <!-- Soft Judges -->
  <rect x="890" y="315" width="250" height="60" rx="8" fill="rgba(240,136,62,0.1)" stroke="#f0883e" stroke-width="1.5"/>
  <text x="905" y="340" font-size="14" font-weight="600" fill="#f0883e">LLM-as-Judge 软裁判</text>
  <text x="905" y="360" font-size="12" fill="#e6edf3">准确性 / 逻辑性 / 合规性</text>
  <text x="905" y="372" font-size="11" fill="#8b949e">人工抽检对齐 ≥ 90%</text>

  <!-- ========== Bottom: Engineering Fallbacks ========== -->
  <rect x="590" y="420" width="570" height="200" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="610" y="455" font-size="18" font-weight="700" fill="#bc8cff">工程兜底方案</text>
  <text x="610" y="478" font-size="12" fill="#8b949e">三大坑 + 三大利器</text>

  <!-- Pitfalls and Solutions -->
  <rect x="610" y="500" width="165" height="40" rx="6" fill="#1c2128" stroke="#ff7b72" stroke-width="1"/>
  <text x="625" y="520" font-size="12" font-weight="600" fill="#ff7b72">级联错误</text>
  <text x="625" y="535" font-size="10" fill="#8b949e">第一步错 → 全链路崩</text>

  <rect x="790" y="500" width="165" height="40" rx="6" fill="#1c2128" stroke="#ff7b72" stroke-width="1"/>
  <text x="805" y="520" font-size="12" font-weight="600" fill="#ff7b72">非确定性</text>
  <text x="805" y="535" font-size="10" fill="#8b949e">同输入 → 不同输出</text>

  <rect x="970" y="500" width="165" height="40" rx="6" fill="#1c2128" stroke="#ff7b72" stroke-width="1"/>
  <text x="985" y="520" font-size="12" font-weight="600" fill="#ff7b72">裁判幻觉</text>
  <text x="985" y="535" font-size="10" fill="#8b949e">Agent 骗过裁判</text>

  <!-- Solutions -->
  <rect x="610" y="555" width="165" height="40" rx="6" fill="rgba(63,185,80,0.1)" stroke="#3fb950" stroke-width="1"/>
  <text x="625" y="575" font-size="12" font-weight="600" fill="#3fb950">Mock 隔离</text>
  <text x="625" y="590" font-size="10" fill="#8b949e">固定返回值，控制变量</text>

  <rect x="790" y="555" width="165" height="40" rx="6" fill="rgba(63,185,80,0.1)" stroke="#3fb950" stroke-width="1"/>
  <text x="805" y="575" font-size="12" font-weight="600" fill="#3fb950">Docker 沙盒</text>
  <text x="805" y="590" font-size="10" fill="#8b949e">固定环境 + 随机种子</text>

  <rect x="970" y="555" width="165" height="40" rx="6" fill="rgba(63,185,80,0.1)" stroke="#3fb950" stroke-width="1"/>
  <text x="985" y="575" font-size="12" font-weight="600" fill="#3fb950">多路裁判</text>
  <text x="985" y="590" font-size="10" fill="#8b949e">2~3 模型交叉 + 人工兜底</text>

  <!-- ========== Bottom Summary ========== -->
  <rect x="40" y="650" width="1120" height="280" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="685" font-size="18" font-weight="700" fill="#58a6ff">落地 Checklist</text>

  <!-- Checklist Grid -->
  <g font-size="13" fill="#e6edf3">
    <!-- Row 1 -->
    <rect x="60" y="705" width="260" height="45" rx="6" fill="#1c2128"/>
    <text x="75" y="730" fill="#3fb950">✓</text>
    <text x="95" y="730">三层指标全覆盖</text>

    <rect x="340" y="705" width="260" height="45" rx="6" fill="#1c2128"/>
    <text x="355" y="730" fill="#3fb950">✓</text>
    <text x="375" y="730">自动化校验焊进 CI/CD</text>

    <rect x="620" y="705" width="260" height="45" rx="6" fill="#1c2128"/>
    <text x="635" y="730" fill="#3fb950">✓</text>
    <text x="655" y="730">成功率设为质量门禁</text>

    <rect x="900" y="705" width="260" height="45" rx="6" fill="#1c2128"/>
    <text x="915" y="730" fill="#3fb950">✓</text>
    <text x="935" y="730">确定性任务用硬断言</text>

    <!-- Row 2 -->
    <rect x="60" y="765" width="260" height="45" rx="6" fill="#1c2128"/>
    <text x="75" y="790" fill="#3fb950">✓</text>
    <text x="95" y="790">非确定性用 LLM-as-Judge</text>

    <rect x="340" y="765" width="260" height="45" rx="6" fill="#1c2128"/>
    <text x="355" y="790" fill="#3fb950">✓</text>
    <text x="375" y="790">Mock 隔离归因</text>

    <rect x="620" y="765" width="260" height="45" rx="6" fill="#1c2128"/>
    <text x="635" y="790" fill="#3fb950">✓</text>
    <text x="655" y="790">多路裁判防幻觉</text>

    <rect x="900" y="765" width="260" height="45" rx="6" fill="#1c2128"/>
    <text x="915" y="790" fill="#3fb950">✓</text>
    <text x="935" y="790">Docker 保证可复现</text>

    <!-- Row 3: Don'ts -->
    <rect x="60" y="825" width="260" height="45" rx="6" fill="rgba(255,123,114,0.08)" stroke="#ff7b72" stroke-width="1"/>
    <text x="75" y="850" fill="#ff7b72">✗</text>
    <text x="95" y="850">只看任务成功率</text>

    <rect x="340" y="825" width="260" height="45" rx="6" fill="rgba(255,123,114,0.08)" stroke="#ff7b72" stroke-width="1"/>
    <text x="355" y="850" fill="#ff7b72">✗</text>
    <text x="375" y="850">不设成本红线</text>

    <rect x="620" y="825" width="260" height="45" rx="6" fill="rgba(255,123,114,0.08)" stroke="#ff7b72" stroke-width="1"/>
    <text x="635" y="850" fill="#ff7b72">✗</text>
    <text x="655" y="850">单模型评测</text>

    <rect x="900" y="825" width="260" height="45" rx="6" fill="rgba(255,123,114,0.08)" stroke="#ff7b72" stroke-width="1"/>
    <text x="915" y="850" fill="#ff7b72">✗</text>
    <text x="935" y="850">忽略裁判幻觉</text>
  </g>

  <!-- Footer -->
  <text x="600" y="948" text-anchor="middle" font-size="12" fill="#8b949e">E06 · Agent 性能量化体系 | 核心思想：过程量化 > 结果量化 | 工具：LangSmith + Prometheus + Docker</text>
</svg>
